<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 336" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-v3-recovery-title cubvec-2026-v3-recovery-desc" id="cubvec-2026-v3-recovery-root">
<title id="cubvec-2026-v3-recovery-title">강제 종료와 복구 시나리오</title>
<desc id="cubvec-2026-v3-recovery-desc">세션이 200건을 삽입해 커밋하고 다른 UPDATE를 커밋하지 않은 상태에서 서버를 강제 종료한 뒤, 재시작 복구 후 커밋한 행만 검색되는지 확인한다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-v3-recovery-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
      #cubvec-2026-v3-recovery-root .diagram-container { width: 100%; overflow-x: auto; }</style><marker id="cubvec-2026-v3-recovery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="cubvec-2026-v3-recovery-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="cubvec-2026-v3-recovery-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="16" y="28" fill="#3b4252" font-size="16" font-weight="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">강제 종료와 복구 시나리오</text>
<text x="16" y="84" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">세션</text>
<text x="16" y="164" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">서버</text>
<text x="16" y="244" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">확인</text>
<line x1="224" y1="80" x2="240" y2="80" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v3-recovery-arrow)"/>
<line x1="328" y1="80" x2="344" y2="80" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v3-recovery-arrow)"/>
<line x1="552" y1="160" x2="568" y2="160" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v3-recovery-arrow)"/>
<line x1="616" y1="180" x2="616" y2="216" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v3-recovery-arrow)"/>
<rect x="112" y="58" width="112" height="44" rx="6" fill="#fbfaf7"/><rect x="112" y="58" width="112" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="168.0" y="84.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">INSERT 200건</text>
<rect x="240" y="58" width="88" height="44" rx="6" fill="#fbfaf7"/><rect x="240" y="58" width="88" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="284.0" y="84.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">COMMIT</text>
<rect x="344" y="58" width="112" height="44" rx="6" fill="#fbfaf7"/><rect x="344" y="58" width="112" height="44" rx="6" fill="#fff6e5" stroke="#b8860b" stroke-width="1"/><text x="400.0" y="78.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">UPDATE</text><text x="400.0" y="93.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">not committed</text>
<rect x="112" y="150" width="360" height="20" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="292.0" y="163.0" fill="#3b4252" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">cub_server running</text>
<rect x="480" y="140" width="72" height="40" rx="6" fill="#fbfaf7"/><rect x="480" y="140" width="72" height="40" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1"/><text x="516.0" y="164.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">kill -9</text>
<rect x="568" y="140" width="96" height="40" rx="6" fill="#fbfaf7"/><rect x="568" y="140" width="96" height="40" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="616.0" y="158.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">재시작</text><text x="616.0" y="173.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">recovery</text>
<rect x="568" y="216" width="96" height="44" rx="6" fill="#fbfaf7"/><rect x="568" y="216" width="96" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="616.0" y="236.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">SELECT</text><text x="616.0" y="251.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">search + count</text>
<text x="16" y="296" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">커밋한 200건은 재시작 뒤 모두 검색되고, 커밋하지 않은 UPDATE는 남지 않아야 한다.</text>
<text x="16" y="316" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">힙의 행 상태와 벡터 검색 결과가 일치할 때만 통과다.</text>
