<title id="cubvec-2026-t2-vacuum-title">DELETE·UPDATE에서 vacuum까지</title>
<desc id="cubvec-2026-t2-vacuum-desc">DELETE와 UPDATE가 엔트리에 제거 MVCCID를 표시하면, 그 버전을 보는 스냅샷이 사라진 뒤 vacuum이 노드를 삭제 상태로 바꾸고, 이웃 목록을 다시 이은 다음 선택적으로 공간을 회수한다.</desc>
