<rect x="184" y="52" width="144" height="52" rx="6" fill="#fbfaf7"/><rect x="184" y="52" width="144" height="52" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="256.0" y="76.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">② vacuum 판정</text><text x="256.0" y="91.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">no snapshot sees it</text>
