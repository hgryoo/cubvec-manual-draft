<text x="16" y="244" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">제거 대기·삭제된 노드도 검색 경로로는 쓰이지만 결과에는 나오지 않는다. 보수는 죽은 노드를 가리키던</text>
<text x="16" y="264" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">이웃 목록을 다시 잇는다(초록). 공간 회수는 보수가 끝난 뒤에만 하며, 파라미터로 켜고 끈다.</text>
