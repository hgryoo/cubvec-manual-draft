<rect x="264" y="142" width="120" height="44" rx="6" fill="#fbfaf7"/><rect x="264" y="142" width="120" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="324.0" y="162.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">차원 + float32</text><text x="324.0" y="177.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">binary</text>
