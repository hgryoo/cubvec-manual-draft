<line x1="240" y1="244" x2="264" y2="244" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q2-driver-arrow)"/>
<line x1="384" y1="244" x2="408" y2="244" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q2-driver-arrow)"/>
<line x1="528" y1="244" x2="552" y2="244" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q2-driver-arrow)"/>
<rect x="120" y="222" width="120" height="44" rx="6" fill="#fbfaf7"/><rect x="120" y="222" width="120" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="180.0" y="242.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">copy() writer</text><text x="180.0" y="257.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">write_row()</text>
<rect x="264" y="222" width="120" height="44" rx="6" fill="#fbfaf7"/><rect x="264" y="222" width="120" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="324.0" y="242.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">바이너리 행</text><text x="324.0" y="257.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">FORMAT BINARY</text>
<rect x="408" y="222" width="120" height="44" rx="6" fill="#fbfaf7"/><rect x="408" y="222" width="120" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="468.0" y="242.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">서버</text><text x="468.0" y="257.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">copy session</text>
