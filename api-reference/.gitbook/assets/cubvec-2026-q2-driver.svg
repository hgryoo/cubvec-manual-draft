<text x="16" y="300" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">문자열 경로는 질의마다 float 배열을 문자열로 바꾸고, CAS가 다시 파싱한다.</text>
<text x="16" y="320" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">네이티브 전송과 COPY는 float 배열을 그대로 보낸다.</text>
