<rect x="384" y="62" width="104" height="44" rx="6" fill="#fbfaf7"/><rect x="384" y="62" width="104" height="44" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1"/><text x="436.0" y="82.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">CAS 파싱</text><text x="436.0" y="97.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">per query</text>
