<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-t4-recovery-title cubvec-2026-t4-recovery-desc" id="cubvec-2026-t4-recovery-root">
<title id="cubvec-2026-t4-recovery-title">로그 레코드와 복구</title>
<desc id="cubvec-2026-t4-recovery-desc">벡터 인덱스 변경은 삽입·삭제·되살리기 로그 레코드로 남고, 비정상 종료 뒤 재시작 복구가 커밋된 변경은 REDO로, 커밋되지 않은 변경은 UNDO로 처리해 힙과 인덱스를 맞춘다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-t4-recovery-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
      #cubvec-2026-t4-recovery-root .diagram-container { width: 100%; overflow-x: auto; }</style><marker id="cubvec-2026-t4-recovery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="cubvec-2026-t4-recovery-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="cubvec-2026-t4-recovery-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
