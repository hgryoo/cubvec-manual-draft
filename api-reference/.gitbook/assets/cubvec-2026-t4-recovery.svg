<rect x="192" y="72" width="136" height="26" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="260.0" y="89.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">엔트리 삽입</text>
<rect x="192" y="104" width="136" height="26" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="260.0" y="121.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">엔트리 삭제</text>
<rect x="192" y="136" width="136" height="26" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="260.0" y="153.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">엔트리 되살리기</text>
<rect x="368" y="84" width="112" height="48" rx="6" fill="#fbfaf7"/><rect x="368" y="84" width="112" height="48" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1"/><text x="424.0" y="106.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">비정상 종료</text><text x="424.0" y="121.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">kill -9</text>
<rect x="504" y="84" width="160" height="48" rx="6" fill="#fbfaf7"/><rect x="504" y="84" width="160" height="48" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="584.0" y="106.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">재시작 복구</text><text x="584.0" y="121.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">log replay</text>
<rect x="416" y="196" width="120" height="44" rx="6" fill="#fbfaf7"/><rect x="416" y="196" width="120" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="476.0" y="216.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">REDO</text><text x="476.0" y="231.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">committed txns</text>
<rect x="552" y="196" width="112" height="44" rx="6" fill="#fbfaf7"/><rect x="552" y="196" width="112" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="608.0" y="216.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">UNDO</text><text x="608.0" y="231.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">uncommitted txns</text>
<rect x="432" y="280" width="232" height="44" rx="20" fill="#fbfaf7"/><rect x="432" y="280" width="232" height="44" rx="20" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="548.0" y="306.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">힙과 인덱스 검색 결과 일치</text>
<text x="16" y="360" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">로그 레코드는 페이지 바이트가 아니라 '어느 행의 어떤 벡터'라는 논리 연산을 남긴다.</text>
<text x="16" y="380" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">복구는 커밋된 변경을 다시 적용하고(REDO), 커밋되지 않은 변경을 되돌린다(UNDO).</text>
</svg>
