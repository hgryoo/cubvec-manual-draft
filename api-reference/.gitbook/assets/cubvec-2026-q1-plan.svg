<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 352" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-q1-plan-title cubvec-2026-q1-plan-desc" id="cubvec-2026-q1-plan-root">
<title id="cubvec-2026-q1-plan-title">벡터 인덱스 스캔 플랜</title>
<desc id="cubvec-2026-q1-plan-desc">인덱스가 없으면 모든 행의 거리를 계산해 정렬한 뒤 k건을 자르지만, 벡터 인덱스 스캔 플랜은 거리 순서로 결과를 받으므로 정렬 단계 없이 k건을 자른다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-q1-plan-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
      #cubvec-2026-q1-plan-root .diagram-container { width: 100%; overflow-x: auto; }</style><marker id="cubvec-2026-q1-plan-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="cubvec-2026-q1-plan-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="cubvec-2026-q1-plan-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="16" y="28" fill="#3b4252" font-size="16" font-weight="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">벡터 인덱스 스캔 플랜</text>
<rect x="16" y="48" width="312" height="232" rx="8" fill="none" stroke="#d8dee9" stroke-width="1.2" stroke-dasharray="4,3"/><text x="28" y="68" fill="#666666" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">인덱스 없음</text>
<rect x="352" y="48" width="312" height="232" rx="8" fill="none" stroke="#d8dee9" stroke-width="1.2" stroke-dasharray="4,3"/><text x="364" y="68" fill="#666666" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">벡터 인덱스</text>
<line x1="172" y1="128" x2="172" y2="156" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q1-plan-arrow)"/>
<line x1="172" y1="200" x2="172" y2="228" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q1-plan-arrow)"/>
<line x1="508" y1="128" x2="508" y2="228" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q1-plan-arrow)"/>
<text x="520" y="182" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">정렬 단계 없음</text>
<rect x="72" y="84" width="200" height="44" rx="6" fill="#fbfaf7"/><rect x="72" y="84" width="200" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="172.0" y="104.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">힙 스캔</text><text x="172.0" y="119.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">distance for every row</text>
<rect x="72" y="156" width="200" height="44" rx="6" fill="#fbfaf7"/><rect x="72" y="156" width="200" height="44" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1"/><text x="172.0" y="176.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">정렬</text><text x="172.0" y="191.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">ORDER BY dist</text>
<rect x="72" y="228" width="200" height="40" rx="6" fill="#fbfaf7"/><rect x="72" y="228" width="200" height="40" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="172.0" y="252.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">LIMIT k</text>
<rect x="408" y="84" width="200" height="44" rx="6" fill="#fbfaf7"/><rect x="408" y="84" width="200" height="44" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="508.0" y="104.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">벡터 인덱스 스캔</text><text x="508.0" y="119.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">nearest first</text>
<rect x="408" y="228" width="200" height="40" rx="6" fill="#fbfaf7"/><rect x="408" y="228" width="200" height="40" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="508.0" y="252.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">LIMIT k</text>
<text x="16" y="312" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">ORDER BY의 거리 함수·연산자가 인덱스의 컬럼과 메트릭에 맞고 LIMIT이 있으면,</text>
<text x="16" y="332" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">옵티마이저가 오른쪽 플랜을 고른다. 인덱스가 거리 순서로 결과를 넘기므로 정렬을 붙이지 않는다.</text>
</svg>
