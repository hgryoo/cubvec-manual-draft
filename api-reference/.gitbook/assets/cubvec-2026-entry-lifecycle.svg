<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 342.0" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-entry-lifecycle-title cubvec-2026-entry-lifecycle-desc" id="cubvec-2026-entry-lifecycle-root">
<title id="cubvec-2026-entry-lifecycle-title">벡터 인덱스 엔트리의 생명주기</title>
<desc id="cubvec-2026-entry-lifecycle-desc">인덱스 엔트리는 삽입되면 유효 상태가 되고, DELETE나 UPDATE가 제거 MVCCID를 남기면 제거 대기 상태가 되며, 그 버전을 보는 스냅샷이 사라지면 vacuum이 삭제됨 상태로 바꾼 뒤 이웃을 보수하고 공간을 회수한다. 롤백은 제거 표시를 되돌리거나 삽입한 엔트리를 삭제됨으로 바꾼다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-entry-lifecycle-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
      #cubvec-2026-entry-lifecycle-root .diagram-container { width: 100%; overflow-x: auto; }</style><marker id="cubvec-2026-entry-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="cubvec-2026-entry-lifecycle-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="cubvec-2026-entry-lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="16" y="28" fill="#3b4252" font-size="16" font-weight="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">벡터 인덱스 엔트리의 생명주기</text>
<line x1="30" y1="172" x2="64" y2="172" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-entry-lifecycle-arrow)"/>
<rect x="22" y="153" width="40" height="12" fill="#fbfaf7"/><text x="42" y="162" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT</text>
<line x1="192" y1="163" x2="272" y2="163" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-entry-lifecycle-arrow)"/>
<rect x="196" y="145" width="72" height="12" fill="#fbfaf7"/><text x="232.0" y="154" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">DELETE·UPDATE</text>
<line x1="272" y1="181" x2="192" y2="181" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-entry-lifecycle-arrow)"/>
<rect x="208" y="193" width="48" height="12" fill="#fbfaf7"/><text x="232.0" y="202" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">ROLLBACK</text>
<line x1="400" y1="172" x2="480" y2="172" stroke="#c62828" stroke-width="1.2" marker-end="url(#cubvec-2026-entry-lifecycle-arrow-accent)"/>
<rect x="420" y="153" width="40" height="12" fill="#fbfaf7"/><text x="440.0" y="162" fill="#c62828" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">VACUUM</text>
<path d="M 128.0,146.0 V 114.0 Q 128.0,106.0 136.0,106.0 H 536.0 Q 544.0,106.0 544.0,114.0 V 146.0" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-entry-lifecycle-arrow)"/>
<rect x="294" y="89.0" width="84" height="12" fill="#fbfaf7"/><text x="336.0" y="98.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle" letter-spacing="0.06em">INSERT ROLLBACK</text>
<line x1="544.0" y1="198.0" x2="544.0" y2="252.0" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-entry-lifecycle-arrow)"/>
<rect x="552" y="225.0" width="88" height="12" fill="#fbfaf7"/><text x="556.0" y="234.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="start" letter-spacing="0.06em">REPAIR · RECLAIM</text>
<circle cx="24" cy="172" r="6" fill="#3b4252"/>
<rect x="64" y="146.0" width="128" height="52" rx="6" fill="#fbfaf7"/><rect x="64" y="146.0" width="128" height="52" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="128.0" y="170.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">유효</text><text x="128.0" y="186.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">ins = T1, del = -</text>
<rect x="272" y="146.0" width="128" height="52" rx="6" fill="#fbfaf7"/><rect x="272" y="146.0" width="128" height="52" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="336.0" y="170.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">제거 대기</text><text x="336.0" y="186.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">del = T2 stamped</text>
<rect x="480" y="146.0" width="128" height="52" rx="6" fill="#fbfaf7"/><rect x="480" y="146.0" width="128" height="52" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1"/><text x="544.0" y="170.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">삭제됨</text><text x="544.0" y="186.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">tombstone</text>
<circle cx="544.0" cy="262.0" r="8" fill="none" stroke="#3b4252" stroke-width="1.2"/>
<circle cx="544.0" cy="262.0" r="5" fill="#3b4252"/>
<text x="528.0" y="266.0" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="end">회수 (선택)</text>
<text x="16" y="302.0" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">검색은 스냅샷이 삽입(ins)은 보고 제거(del)는 보지 않는 엔트리만 결과로 돌려준다.</text>
<text x="16" y="322.0" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">각 전이는 전용 로그 레코드로 남아, 크래시 뒤 REDO와 UNDO로 같은 상태를 다시 만든다.</text>
</svg>
