<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-q3-stats-title cubvec-2026-q3-stats-desc" id="cubvec-2026-q3-stats-root">
<title id="cubvec-2026-q3-stats-title">trace와 statdump</title>
<desc id="cubvec-2026-q3-stats-desc">벡터 인덱스 스캔과 빌드에서 나온 값은 trace에서 질의별 합계로, statdump에서 탐색·삽입·후보 큐·스토리지와 캐시·레벨 0 묶음의 누적 카운터로 보인다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-q3-stats-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
      #cubvec-2026-q3-stats-root .diagram-container { width: 100%; overflow-x: auto; }</style><marker id="cubvec-2026-q3-stats-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="cubvec-2026-q3-stats-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="cubvec-2026-q3-stats-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="16" y="28" fill="#3b4252" font-size="16" font-weight="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">trace와 statdump</text>
<rect x="272" y="160" width="392" height="128" rx="8" fill="none" stroke="#d8dee9" stroke-width="1.2" stroke-dasharray="4,3"/><text x="284" y="180" fill="#666666" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">statdump · HNSW 통계</text>
<path d="M 192,144 L 216,144 Q 224,144 224,136 L 224,100 Q 224,92 232,92 L 272,92" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q3-stats-arrow)"/>
<path d="M 192,160 L 216,160 Q 224,160 224,168 L 224,212 Q 224,220 232,220 L 272,220" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-q3-stats-arrow)"/>
<rect x="16" y="128" width="176" height="48" rx="6" fill="#fbfaf7"/><rect x="16" y="128" width="176" height="48" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="104.0" y="150.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">벡터 인덱스 스캔 · 빌드</text><text x="104.0" y="165.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">HNSW search / insert</text>
<rect x="272" y="64" width="392" height="56" rx="6" fill="#fbfaf7"/><rect x="272" y="64" width="392" height="56" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="468.0" y="90.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">trace (;trace on)</text><text x="468.0" y="105.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">per query: time · fetch · ioread</text>
<rect x="288" y="196" width="112" height="30" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="344.0" y="215.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">탐색</text>
<rect x="412" y="196" width="112" height="30" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="468.0" y="215.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">삽입</text>
<rect x="536" y="196" width="112" height="30" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="592.0" y="215.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">후보 큐</text>
<rect x="288" y="236" width="112" height="30" rx="4" fill="#ffffff" stroke="#3b4252" stroke-width="0.8"/><text x="344.0" y="255.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">스토리지 · 캐시</text>
<rect x="412" y="236" width="112" height="30" rx="4" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="0.8"/><text x="468.0" y="255.0" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">레벨 0</text>
<text x="16" y="320" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">trace는 질의 하나의 합계를, statdump는 서버 전체의 누적 카운터를 보여 준다.</text>
<text x="16" y="340" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">탐색 비용의 대부분이 가장 아래 레벨에서 생기므로, 레벨 0 값을 따로 센다.</text>
</svg>
