<title id="cubvec-2026-d6-cache-title">이웃 캐시로 페이지 고정 줄이기</title>
<desc id="cubvec-2026-d6-cache-desc">이웃 목록이 캐시에 있으면 페이지를 고정하지 않고 읽고, 없으면 페이지를 고정해 읽은 뒤 캐시에 저장한다. 벡터 캐시도 같은 방식으로 동작한다.</desc>
