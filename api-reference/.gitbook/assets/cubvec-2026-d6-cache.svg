<rect x="96" y="364" width="208" height="48" rx="6" fill="#fbfaf7"/><rect x="96" y="364" width="208" height="48" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200.0" y="386.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">이웃마다 거리 계산</text><text x="200.0" y="401.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">vector cache works the same</text>
<text x="16" y="448" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">노드 방문 한 번이 페이지 고정 한 번이므로, 캐시 적중이 곧 디스크 I/O 절감이다.</text>
<text x="16" y="468" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">nytimes-256 인덱스 빌드에서 데이터 페이지 접근이 약 267억 회에서 7,085만 회로 줄었다.</text>
