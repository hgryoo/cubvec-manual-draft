<title id="cubvec-2026-b1-procedure-title">ann-benchmarks 측정 절차</title>
<desc id="cubvec-2026-b1-procedure-desc">빌드 단계에서는 DB를 기동하고 벡터를 COPY로 적재한 뒤 인덱스를 빌드하고 서버를 재시작하며, 질의 단계에서는 ef_search를 설정하고 질의를 prepare한 뒤 네이티브 벡터로 바인드해 실행하고 Recall과 QPS를 계산한다.</desc>
