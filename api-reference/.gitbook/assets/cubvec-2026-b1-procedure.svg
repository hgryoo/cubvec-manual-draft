<rect x="392" y="186" width="124" height="44" rx="6" fill="#fbfaf7"/><rect x="392" y="186" width="124" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="454.0" y="206.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">바인드 · 실행</text><text x="454.0" y="221.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">native vector bind</text>
