<text x="16" y="264" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">빌드 단계(fit)의 시간이 인덱스 빌드 성능이다. 질의 단계에서는 ann-benchmarks가</text>
<text x="16" y="284" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">Recall과 QPS를 계산하며, 이 단계를 ef_search 값마다 한 번씩 되풀이한다.</text>
