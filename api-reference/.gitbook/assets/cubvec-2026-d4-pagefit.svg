<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-d4-pagefit-title cubvec-2026-d4-pagefit-desc" id="cubvec-2026-d4-pagefit-root">
<title id="cubvec-2026-d4-pagefit-title">새 노드를 페이지에 놓는 흐름</title>
<desc id="cubvec-2026-d4-pagefit-desc">새 노드가 어떤 페이지에도 들어가지 않으면 삽입 오류로 처리하고, 마지막 페이지에 여유가 없으면 시스템 연산으로 새 페이지를 할당한 뒤 레코드를 추가한다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-d4-pagefit-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
      #cubvec-2026-d4-pagefit-root .diagram-container { width: 100%; overflow-x: auto; }</style><marker id="cubvec-2026-d4-pagefit-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="cubvec-2026-d4-pagefit-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="cubvec-2026-d4-pagefit-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="16" y="28" fill="#3b4252" font-size="16" font-weight="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">새 노드를 페이지에 놓는 흐름</text>
<line x1="200" y1="96" x2="200" y2="118" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-d4-pagefit-arrow)"/>
<line x1="300" y1="150" x2="400" y2="150" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-d4-pagefit-arrow)"/>
<rect x="328" y="128" width="44" height="16" fill="#fbfaf7"/><text x="350" y="140" fill="#666666" font-size="12" font-weight="400" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">아니오</text>
<line x1="200" y1="182" x2="200" y2="224" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-d4-pagefit-arrow)"/>
<rect x="208" y="196" width="20" height="16" fill="#fbfaf7"/><text x="212" y="208" fill="#666666" font-size="12" font-weight="400" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">예</text>
<line x1="316" y1="258" x2="400" y2="258" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-d4-pagefit-arrow)"/>
<rect x="336" y="236" width="44" height="16" fill="#fbfaf7"/><text x="358" y="248" fill="#666666" font-size="12" font-weight="400" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">아니오</text>
<line x1="200" y1="292" x2="200" y2="356" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-d4-pagefit-arrow)"/>
<rect x="208" y="316" width="20" height="16" fill="#fbfaf7"/><text x="212" y="328" fill="#666666" font-size="12" font-weight="400" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">예</text>
<path d="M 480,282 L 480,372 Q 480,380 472,380 L 304,380" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-d4-pagefit-arrow)"/>
<rect x="100" y="52" width="200" height="44" rx="20" fill="#fbfaf7"/><rect x="100" y="52" width="200" height="44" rx="20" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200.0" y="72.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">새 노드</text><text x="200.0" y="87.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">size from dim, M, level</text>
<polygon points="200,118.0 300.0,150 200,182.0 100.0,150" fill="#fbfaf7"/><polygon points="200,118.0 300.0,150 200,182.0 100.0,150" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200" y="146" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">한 페이지에</text><text x="200" y="162" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">들어가나?</text>
<rect x="400" y="126" width="176" height="48" rx="6" fill="#fbfaf7"/><rect x="400" y="126" width="176" height="48" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1"/><text x="488.0" y="148.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">삽입 오류</text><text x="488.0" y="163.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">before any page is allocated</text>
<polygon points="200,224.0 316.0,258 200,292.0 84.0,258" fill="#fbfaf7"/><polygon points="200,224.0 316.0,258 200,292.0 84.0,258" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200" y="254" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">마지막 페이지에</text><text x="200" y="270" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">여유가 있나?</text>
<rect x="400" y="234" width="160" height="48" rx="6" fill="#fbfaf7"/><rect x="400" y="234" width="160" height="48" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="480.0" y="256.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">새 페이지 할당</text><text x="480.0" y="271.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">system operation</text>
<rect x="96" y="356" width="208" height="48" rx="6" fill="#fbfaf7"/><rect x="96" y="356" width="208" height="48" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200.0" y="384.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">그 페이지에 레코드 추가</text>
<text x="16" y="440" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">페이지 크기는 데이터베이스를 만들 때 정한 4K·8K·16K이고, 레코드 하나는 페이지 하나를 넘을 수 없다.</text>
<text x="16" y="460" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">새 페이지는 시스템 연산으로 할당하므로, 트랜잭션을 롤백해도 해제되지 않는다.</text>
</svg>
