<line x1="500" y1="284" x2="500" y2="316" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v4-concurrency-arrow)"/>
<rect x="508" y="292" width="44" height="16" fill="#fbfaf7"/><text x="512" y="304" fill="#666666" font-size="12" font-weight="400" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">아니오</text>
<rect x="32" y="84" width="120" height="40" rx="6" fill="#fbfaf7"/><rect x="32" y="84" width="120" height="40" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="92.0" y="108.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">삽입 세션들</text>
<rect x="176" y="84" width="112" height="40" rx="6" fill="#fbfaf7"/><rect x="176" y="84" width="112" height="40" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="232.0" y="108.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">검색 세션</text>
<rect x="32" y="176" width="256" height="44" rx="6" fill="#fbfaf7"/><rect x="32" y="176" width="256" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="160.0" y="196.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">같은 HNSW 인덱스</text><text x="160.0" y="211.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">searched while it is built</text>
<rect x="392" y="84" width="216" height="40" rx="6" fill="#fbfaf7"/><rect x="392" y="84" width="216" height="40" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="500.0" y="108.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">테이블의 모든 행 r</text>
<rect x="392" y="152" width="216" height="44" rx="6" fill="#fbfaf7"/><rect x="392" y="152" width="216" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="500.0" y="172.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">r의 벡터로 최근접 1건</text><text x="500.0" y="187.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">1-NN search</text>
<polygon points="500,220.0 580.0,252 500,284.0 420.0,252" fill="#fbfaf7"/><polygon points="500,220.0 580.0,252 500,284.0 420.0,252" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="500" y="256" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">결과가 r인가?</text>
<rect x="600" y="232" width="56" height="40" rx="6" fill="#fbfaf7"/><rect x="600" y="232" width="56" height="40" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/><text x="628.0" y="256.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">통과</text>
<rect x="424" y="316" width="152" height="44" rx="6" fill="#fbfaf7"/><rect x="424" y="316" width="152" height="44" rx="6" fill="#c62828" fill-opacity="0.08" stroke="#c62828" stroke-width="1"/><text x="500.0" y="342.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">노드 유실 · 고립</text>
<text x="16" y="416" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">동시 실행에서는 그래프가 매번 다르게 만들어지므로, 어떤 근사 결과가 나오는지는 판정하지 않는다.</text>
<text x="16" y="436" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">오류·latch 시간 초과가 없고, 돌려준 행이 실제 행이며, 모든 행이 자기 벡터로 검색되는지를 본다.</text>
