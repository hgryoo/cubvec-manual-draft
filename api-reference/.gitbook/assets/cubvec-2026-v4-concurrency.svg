<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-v4-concurrency-title cubvec-2026-v4-concurrency-desc" id="cubvec-2026-v4-concurrency-root">
<title id="cubvec-2026-v4-concurrency-title">동시성 시나리오와 자기 검색 검사</title>
<desc id="cubvec-2026-v4-concurrency-desc">여러 삽입 세션과 검색 세션이 같은 인덱스를 동시에 쓰고 읽은 뒤, 모든 행에 대해 자기 벡터로 최근접 1건을 검색해 그 행 자신이 나오는지로 그래프가 온전한지 판정한다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-v4-concurrency-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
