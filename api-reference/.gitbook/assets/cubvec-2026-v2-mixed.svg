<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 416" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-v2-mixed-title cubvec-2026-v2-mixed-desc" id="cubvec-2026-v2-mixed-root">
<title id="cubvec-2026-v2-mixed-title">조건 결합 질의의 판정 기준</title>
<desc id="cubvec-2026-v2-mixed-desc">인덱스를 쓰지 않는 질의는 조건을 만족하는 행을 전부 정렬한 결과와 같아야 하고, 인덱스를 쓰는 질의는 k건 이하이며 모든 행이 조건을 만족하고 거리 순서여야 한다.</desc>
<defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cubvec-2026-v2-mixed-root { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; color: #3b4252; }
      #cubvec-2026-v2-mixed-root .diagram-container { width: 100%; overflow-x: auto; }</style><marker id="cubvec-2026-v2-mixed-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="cubvec-2026-v2-mixed-arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="cubvec-2026-v2-mixed-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="16" y="28" fill="#3b4252" font-size="16" font-weight="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">조건 결합 질의의 판정 기준</text>
<rect x="16" y="108" width="312" height="236" rx="8" fill="none" stroke="#d8dee9" stroke-width="1.2" stroke-dasharray="4,3"/><text x="28" y="128" fill="#666666" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">인덱스를 쓰지 않는 질의</text>
<rect x="352" y="108" width="312" height="236" rx="8" fill="none" stroke="#d8dee9" stroke-width="1.2" stroke-dasharray="4,3"/><text x="364" y="128" fill="#666666" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">인덱스를 쓰는 질의</text>
<path d="M 300,92 L 180,92 Q 172,92 172,100 L 172,144" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v2-mixed-arrow)"/>
<path d="M 380,92 L 500,92 Q 508,92 508,100 L 508,144" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v2-mixed-arrow)"/>
<line x1="172" y1="188" x2="172" y2="212" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v2-mixed-arrow)"/>
<line x1="508" y1="188" x2="508" y2="212" stroke="#666666" stroke-width="1.2" marker-end="url(#cubvec-2026-v2-mixed-arrow)"/>
<rect x="300" y="52" width="80" height="44" rx="20" fill="#fbfaf7"/><rect x="300" y="52" width="80" height="44" rx="20" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="340.0" y="78.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">질의</text>
<text x="340" y="40" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">WHERE p ORDER BY dist LIMIT k</text>
<rect x="72" y="144" width="200" height="44" rx="6" fill="#fbfaf7"/><rect x="72" y="144" width="200" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="172.0" y="164.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">p를 만족하는 행 전부</text><text x="172.0" y="179.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">exact scan</text>
<rect x="408" y="144" width="200" height="44" rx="6" fill="#fbfaf7"/><rect x="408" y="144" width="200" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="508.0" y="164.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">후보 k개</text><text x="508.0" y="179.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">vector index scan</text>
<rect x="40" y="212" width="264" height="116" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/>
<text x="56" y="236" fill="#2e7d32" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">판정</text>
<text x="56" y="260" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">전체 정렬 결과와 같다</text>
<rect x="376" y="212" width="264" height="116" rx="6" fill="#e6f4ea" stroke="#2e7d32" stroke-width="1"/>
<text x="392" y="236" fill="#2e7d32" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">판정</text>
<text x="392" y="260" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">결과가 k건 이하이다</text>
<text x="392" y="282" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">모든 행이 p를 만족한다</text>
<text x="392" y="304" fill="#3b4252" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">거리 순서로 나온다</text>
<text x="16" y="376" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">조건의 선택도(행의 대부분부터 아주 일부까지)와 LIMIT 값을 바꿔 가며 같은 판정을 반복한다.</text>
<text x="16" y="396" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">인덱스를 쓰는 질의는 조건과 가시성으로 걸러진 만큼 k건보다 적을 수 있다.</text>
</svg>
