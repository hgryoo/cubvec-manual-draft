<rect x="480" y="208" width="88" height="44" rx="6" fill="#fbfaf7"/><rect x="480" y="208" width="88" height="44" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="524.0" y="228.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">B-tree</text><text x="524.0" y="243.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">scan</text>
