<text x="16" y="284" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">인덱스 타입이 카탈로그 세 곳에 함께 기록된다. B-tree 통계에는 B-tree 인덱스만 들어간다.</text>
<text x="16" y="304" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">옵티마이저는 이 타입을 보고 B-tree 스캔과 벡터 인덱스 스캔을 구분한다.</text>
