<text x="16" y="256" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">새 기능의 PR은 자기 케이스를 함께 추가하고, 기존 케이스를 모두 통과해야 병합된다.</text>
<text x="16" y="276" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">케이스는 공개 저장소(cubrid-testcases, cubvec/cubvec)에서 관리한다.</text>
