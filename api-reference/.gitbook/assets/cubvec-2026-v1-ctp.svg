<rect x="16" y="48" width="648" height="176" rx="8" fill="none" stroke="#d8dee9" stroke-width="1.2" stroke-dasharray="4,3"/><text x="28" y="68" fill="#666666" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">PR마다 CI (test_cubvec)</text>
