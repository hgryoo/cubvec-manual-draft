<title id="cubvec-2026-v1-ctp-title">SQL 테스트 케이스와 CI</title>
<desc id="cubvec-2026-v1-ctp-desc">PR마다 CI가 케이스 SQL을 서버에서 실행하고, 실행 결과를 정답 파일과 바이트 단위로 비교해 같을 때만 통과로 판정한다.</desc>
