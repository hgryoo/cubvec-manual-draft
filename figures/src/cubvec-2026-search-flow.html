<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cubvec-2026-search-flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif; background: #fbfaf7;
           color: #3b4252; display: flex; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 720px; width: 100%; }
    .eyebrow { font-family: 'Geist Mono', 'Noto Sans Mono CJK KR', monospace; font-size: 0.66rem;
               letter-spacing: 0.18em; text-transform: uppercase; color: #666666; margin-bottom: 1rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 680px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Process · 2026 development report</p>
    <div class="diagram-container">
<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cubvec-2026-search-flow-title cubvec-2026-search-flow-desc">
<title id="cubvec-2026-search-flow-title">벡터 검색 질의의 실행 흐름</title>
<desc id="cubvec-2026-search-flow-desc">벡터 검색 질의는 정렬 단계 없는 벡터 인덱스 스캔 플랜으로 실행되고, 인덱스가 가까운 후보 k개를 넘기면 실행기가 그 가운데 보이지 않거나 삭제 표시되었거나 조건에 맞지 않는 행을 빼고 돌려주므로, 결과가 k건보다 적을 수 있다.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#666666"/></marker><marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3b4252"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62828"/></marker></defs>
<rect width="100%" height="100%" fill="#fbfaf7"/>
<text x="16" y="28" fill="#3b4252" font-size="16" font-weight="700" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">벡터 검색 질의의 실행 흐름</text>
<line x1="200" y1="100" x2="200" y2="128" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="200" y1="176" x2="200" y2="204" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="200" y1="252" x2="200" y2="280" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="200" y1="328" x2="200" y2="356" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="304.0" y1="304.0" x2="368" y2="304.0" stroke="#666666" stroke-width="1.2" stroke-dasharray="4,3"/>
<rect x="368" y="258.0" width="288" height="92" rx="6" fill="#f4f6f8" stroke="#d8dee9" stroke-width="1"/>
<text x="384" y="282.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">예: LIMIT 10</text>
<text x="384" y="304.0" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">그래프 탐색 → 가까운 후보 10건</text>
<text x="384" y="322.0" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">삭제 표시 1건, 조건 불일치 2건 제외</text>
<text x="384" y="340.0" fill="#c62828" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">결과 7건 (k = 10보다 적음)</text>
<rect x="96.0" y="52" width="208" height="48" rx="20" fill="#fbfaf7"/><rect x="96.0" y="52" width="208" height="48" rx="20" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200.0" y="74.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">벡터 검색 질의</text><text x="200.0" y="90.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">WHERE p ORDER BY dist LIMIT k</text>
<rect x="96.0" y="128" width="208" height="48" rx="6" fill="#fbfaf7"/><rect x="96.0" y="128" width="208" height="48" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200.0" y="150.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">실행 계획</text><text x="200.0" y="166.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">vector index scan, no sort step</text>
<rect x="96.0" y="204" width="208" height="48" rx="6" fill="#fbfaf7"/><rect x="96.0" y="204" width="208" height="48" rx="6" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200.0" y="226.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">그래프 탐색</text><text x="200.0" y="242.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">hnsw_ef_search -&gt; nearest k</text>
<rect x="96.0" y="280" width="208" height="48" rx="6" fill="#fbfaf7"/><rect x="96.0" y="280" width="208" height="48" rx="6" fill="rgba(198,40,40,0.08)" stroke="#c62828" stroke-width="1"/><text x="200.0" y="302.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">가시성 · 조건 적용</text><text x="200.0" y="318.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">drop invisible / tombstoned / not p</text>
<rect x="96.0" y="356" width="208" height="48" rx="20" fill="#fbfaf7"/><rect x="96.0" y="356" width="208" height="48" rx="20" fill="#ffffff" stroke="#3b4252" stroke-width="1"/><text x="200.0" y="378.0" fill="#3b4252" font-size="12" font-weight="600" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="middle">결과 반환</text><text x="200.0" y="394.0" fill="#666666" font-size="8" font-weight="400" font-family="'Geist Mono', 'Noto Sans Mono CJK KR', monospace" text-anchor="middle">nearest first, at most k rows</text>
<text x="16" y="440" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">인덱스는 가까운 후보 k개를 넘기고, 실행기는 그 가운데 조건과 가시성에 맞지 않는 행을 뺀다.</text>
<text x="16" y="460" fill="#666666" font-size="12" font-weight="500" font-family="Pretendard, 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" text-anchor="start">빠진 행은 다시 채우지 않으므로, 조건이 많이 거를수록 결과가 k건보다 적어진다.</text>
</svg>
    </div>
  </div>
</body>
</html>
